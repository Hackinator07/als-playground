<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Ride or fly the full Al's Playground Richard Burns Rally stage in your browser, with the trees, terrain and ground textures from the game.">
<link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
<title>Stage viewer · Al's Playground stage times</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=Barlow:wght@400;500&family=JetBrains+Mono:wght@400&display=swap">
<style>
[hidden]{display:none!important}body{margin:0}:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
/* Layout: full-bleed 3D stage, a control strip along the bottom like a co-driver's tulip roll, minimap top-right. */
:root{
  --spruce:#16271f; --spruce-2:#22392d; --needle:#9fb7a3; --maple:#d9622b; --birch:#eee9df; --line:#3b5444;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif; --body:Barlow,system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%;background:var(--spruce);color:var(--birch);font-family:var(--body);overflow:hidden}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.top{position:fixed;background:#16271fcc;padding:6px 10px;border-radius:4px;top:calc(env(safe-area-inset-top,0px) + 12px);left:max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:2px;pointer-events:none;text-shadow:0 1px 3px #0009}
.top .back{pointer-events:auto;font:500 12px var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--needle);text-decoration:none;text-shadow:none}.top .back:hover{color:var(--birch)}
.top h1{margin:0;font:700 26px/1 var(--display);letter-spacing:.02em;text-transform:uppercase}
.top .sub{font:500 13px var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--needle)}
.read{position:fixed;top:calc(env(safe-area-inset-top,0px) + 92px);left:max(16px,env(safe-area-inset-left,0px));font:400 12px/1.5 var(--mono);color:var(--birch);background:#16271fcc;padding:6px 10px;border-radius:4px;pointer-events:none;font-variant-numeric:tabular-nums}
.read b{font:700 22px var(--display);color:var(--maple);display:block;letter-spacing:.03em}
#map{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:max(16px,env(safe-area-inset-right,0px));width:150px;height:220px;background:#16271fcc;border:1px solid var(--line);border-radius:4px;cursor:crosshair}
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:linear-gradient(transparent,#16271fee 30%);display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.grp{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
button{font:600 14px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--birch);background:var(--spruce-2);border:1px solid var(--line);border-radius:3px;padding:7px 11px;cursor:pointer}
button:hover{border-color:var(--needle)}
button:focus-visible,input:focus-visible{outline:2px solid var(--maple);outline-offset:2px}
button[aria-pressed="true"]{background:var(--maple);border-color:var(--maple);color:#1a0d05}
label{font:500 12px var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--needle);display:flex;gap:6px;align-items:center}
input[type=range]{accent-color:var(--maple);width:120px}
#dist{flex:1 1 260px;min-width:0}
#dist input{width:100%}
.km{font:400 12px var(--mono);color:var(--birch);min-width:62px;text-align:right}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(120px + env(safe-area-inset-bottom,0px));max-width:calc(100% - 32px);background:var(--spruce-2);border:1px solid var(--maple);border-radius:4px;padding:8px 12px;font:400 12px var(--mono);color:var(--birch);user-select:all;overflow-wrap:anywhere;z-index:4}
#joy,#rise{position:fixed;z-index:3;touch-action:none;user-select:none;-webkit-user-select:none}
#joy{left:max(20px,env(safe-area-inset-left,0px));width:128px;height:128px;border-radius:50%;background:#16271f99;border:2px solid var(--needle)}
#joy::before{content:"";position:absolute;inset:50% auto auto 50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--needle)}
#knob{position:absolute;left:39px;top:39px;width:50px;height:50px;border-radius:50%;background:var(--maple);box-shadow:0 2px 6px #0008;pointer-events:none}
#rise{right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:10px}
#rise button{width:64px;height:58px;padding:0;font-size:22px;line-height:1;touch-action:none;background:#22392dd9}
#rise button.on{background:var(--maple);color:#1a0d05}
#osd{position:fixed;inset:0;pointer-events:none;z-index:2;font:500 13px/1.55 var(--mono);color:#fff;text-shadow:0 0 2px #000,0 0 4px #000a;letter-spacing:.06em;font-variant-numeric:tabular-nums}
#osd .g{position:absolute;background:#ffffff59}
#osd .v{top:0;bottom:0;width:1px}#osd .h{left:0;right:0;height:1px}
#osd .x{position:absolute;left:50%;top:50%;width:22px;height:22px;margin:-11px;border:1px solid #fffc;border-radius:50%}
#osd .x::after{content:"";position:absolute;left:50%;top:50%;width:3px;height:3px;margin:-1.5px;background:#fff;border-radius:50%}
#osd .l,#osd .r{position:absolute;top:calc(env(safe-area-inset-top,0px) + 34%)}
#osd .l{left:max(14px,env(safe-area-inset-left,0px))}#osd .r{right:max(14px,env(safe-area-inset-right,0px));text-align:right}
#osd .t{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);left:50%;transform:translateX(-50%);font-size:12px;opacity:.85}
#osd span{opacity:.7}
body.fpv.compact .top,body.fpv.compact .read,body.fpv.compact #map{display:none}
body.fpv.compact #osd .l,body.fpv.compact #osd .r{top:calc(env(safe-area-inset-top,0px) + 70px)}
#load{position:fixed;inset:0;display:grid;place-items:center;background:var(--spruce);z-index:5;text-align:center;padding:0 16px}
#load h2{font:700 44px/1 var(--display);text-transform:uppercase;margin:0 0 8px;letter-spacing:.02em}
#load p{margin:0;color:var(--needle);font:400 13px var(--mono)}
.help{flex-basis:100%;font:400 11px var(--mono);color:var(--needle)}.help b{font-weight:400}
@media (max-width:560px){#map{width:96px;height:140px}.top{max-width:calc(100% - 96px - 48px)}.read{top:calc(env(safe-area-inset-top,0px) + 106px)}.top h1{font-size:20px}input[type=range]{width:90px}}
</style>

</head>
<body>
<canvas id="c" tabindex="0" aria-label="3D view of the stage"></canvas>
<div id="load"><div><h2>Al's Playground</h2><p id="lmsg">Loading stage…</p></div></div>
<div class="top"><a class="back" href="https://hackinator07.github.io/als-playground/">&larr; Stage times</a><h1>Al's Playground</h1><div class="sub" id="ver">LSPR · Baraga County, MI</div></div>
<div class="read" id="read"><b id="rkm">0.00 km</b><span id="rinfo"></span></div>
<div id="joy" hidden aria-label="Move: push to fly forward, back or sideways"><div id="knob"></div></div>
<div id="rise" hidden><button data-u="1" aria-label="Up">&#9650;</button><button data-u="-1" aria-label="Down">&#9660;</button></div>
<div id="osd" hidden aria-hidden="true">
  <i class="g v" style="left:33.333%"></i><i class="g v" style="left:66.666%"></i><i class="g h" style="top:33.333%"></i><i class="g h" style="top:66.666%"></i><i class="x"></i>
  <div class="t">FPV &middot; AL'S PLAYGROUND</div>
  <div class="l"><div><span>ALT </span><b id="oAlt">0</b></div><div><span>SPD </span><b id="oSpd">0</b></div><div><span>TIM </span><b id="oTim">00:00</b></div></div>
  <div class="r"><div><b id="oHdg">000</b><span> HDG</span></div><div><b id="oDst">0.00</b><span> STG</span></div><div><b id="oOff">0</b><span> OFF</span></div></div>
</div>
<div id="toast" role="status" hidden></div>
<canvas id="map" width="300" height="440" aria-label="Stage map; click to jump"></canvas>
<div class="bar">
  <div class="grp" role="group" aria-label="Mode">
    <button id="mRide" aria-pressed="true">Ride</button><button id="mFly" aria-pressed="false">Fly</button><button id="fpv" aria-pressed="false" hidden title="FPV drone view (G)">FPV</button>
    <button id="play" aria-pressed="false">Play</button>
    <button id="units" title="Switch between metric and imperial">km</button>
    <button id="fs" title="Full screen">Full screen</button>
    <button id="share" title="Copy a link to this point on the road">Share this spot</button>
  </div>
  <div class="grp" id="jumps" aria-label="Jump to"></div>
  <label id="dist">Road <input id="d" type="range" min="0" max="12680" step="1" value="0"><span class="km" id="dk">0.00 km</span></label>
  <label>Speed <input id="spd" type="range" min="20" max="200" step="5" value="90"><span class="km" id="spk">90 km/h</span></label>
  <label>View <input id="vd" type="range" min="250" max="1500" step="50" value="700"><span class="km" id="vdk">700 m</span></label>
  <span class="help" id="help">Ride: Space play/pause, drag to look, double-click to recentre · Fly: WASD / arrows, Q/E down/up, Shift fast, drag to look</span>
</div>

<script src="https://cdn.jsdelivr.net/npm/babylonjs@9.27.1/babylon.js"></script>
<script>
(async function(){
const $=id=>document.getElementById(id);
const DATA='data/';
const man=await (await fetch(DATA+'manifest.json',{cache:'no-cache'})).json();
const VQ='?v='+encodeURIComponent(man.version||'0');
$('ver').textContent=`LSPR · Baraga County, MI · build ${man.version}`;
let imp=/-US$/i.test(navigator.language||'');try{const u=localStorage.getItem('alsUnits');if(u)imp=u==='mi';}catch(e){}
const fmtDist=m=>imp?(m/1609.344).toFixed(2)+' mi':(m/1000).toFixed(2)+' km';
const fmtSpd=k=>imp?Math.round(k/1.609344)+' mph':k+' km/h';
const fmtLen=m=>imp?Math.round(m*3.28084).toLocaleString()+' ft':Math.round(m).toLocaleString()+' m';
const L=man.line, LEN=L[L.length-1][3];
$('d').max=Math.floor(LEN);
const O=man.markers.find(m=>m.name==='START').pos; // origin for float precision
const toB=(x,y,z)=>new BABYLON.Vector3(x-O[0],z-O[2],y-O[1]);

const canvas=$('c');
const engine=new BABYLON.Engine(canvas,true,{preserveDrawingBuffer:false,stencil:false,antialias:true},true);
engine.setHardwareScalingLevel(1/Math.min(window.devicePixelRatio||1,1.5));
const scene=new BABYLON.Scene(engine);
const SKY=new BABYLON.Color3(0.70,0.76,0.80);
scene.clearColor=new BABYLON.Color4(SKY.r,SKY.g,SKY.b,1);
scene.skipPointerMovePicking=true;scene.skipPointerDownPicking=true;scene.skipPointerUpPicking=true; scene.autoClear=true;

// ---- shader (matches the stage's Blender/RBR look: unlit texture x baked vertex colour)
BABYLON.Effect.ShadersStore.alsVertexShader=`precision highp float;
attribute vec3 position;attribute vec2 uv;
#ifdef GROUND
attribute vec2 uv2;varying vec2 vUV2;
#endif
attribute vec4 color;uniform mat4 worldViewProjection;uniform mat4 worldView;
varying vec2 vUV;varying vec4 vCol;varying float vDepth;
void main(){vUV=uv;
#ifdef GROUND
vUV2=uv2;
#endif
vCol=color;vec4 p=worldView*vec4(position,1.0);vDepth=length(p.xyz);gl_Position=worldViewProjection*vec4(position,1.0);}`;
BABYLON.Effect.ShadersStore.alsFragmentShader=`precision highp float;
varying vec2 vUV;varying vec4 vCol;varying float vDepth;uniform sampler2D t1;
#ifdef GROUND
varying vec2 vUV2;uniform sampler2D t2;
#endif
uniform vec3 fogColor;uniform vec2 fogRange;uniform float bright;
void main(){vec4 a=texture2D(t1,vUV);vec3 c;
#ifdef GROUND
vec4 b=texture2D(t2,vUV2);c=mix(a.rgb,b.rgb,vCol.a*b.a);
#else
if(a.a<0.5)discard;c=a.rgb;
#endif
c*=vCol.rgb*bright;float f=clamp((vDepth-fogRange.x)/(fogRange.y-fogRange.x),0.0,1.0);
gl_FragColor=vec4(mix(c,fogColor,f),1.0);}`;

const texCache={};
function tex(name){
  if(!texCache[name]){const t=new BABYLON.Texture(DATA+'tex/'+name+'.webp'+VQ,scene,false,true,BABYLON.Texture.TRILINEAR_SAMPLINGMODE);
    t.anisotropicFilteringLevel=8;texCache[name]=t;}
  return texCache[name];
}
let fog=[250,700], bright=1.0;
const matCache={};
function mat(i){
  if(matCache[i])return matCache[i];
  const md=man.materials[i];
  const m=new BABYLON.ShaderMaterial('m'+i,scene,{vertex:'als',fragment:'als'},{
    attributes:md.ground?['position','uv','uv2','color']:['position','uv','color'],
    uniforms:['worldViewProjection','worldView','fogColor','fogRange','bright'],samplers:md.ground?['t1','t2']:['t1'],
    defines:md.ground?['#define GROUND']:[]});
  m.setTexture('t1',tex(md.tex[0])); if(md.ground)m.setTexture('t2',tex(md.tex[1]));
  m.backFaceCulling=false; m.setColor3('fogColor',SKY);
  m.onBindObservable.add(()=>{const e=m.getEffect();e.setFloat2('fogRange',fog[0],fog[1]);e.setFloat('bright',bright);});
  return matCache[i]=m;
}

// ---- tile streaming
const tiles=man.tiles.map(t=>({...t,cx:t.x+man.cell/2-O[0],cz:t.y+man.cell/2-O[1],state:0,meshes:[]}));
let inflight=0;
async function loadTile(t){
  t.state=1;inflight++;
  try{
    const r=await fetch(DATA+'tiles/'+t.id+(man.tileExt||'.bin.gz')+VQ);let buf=new Uint8Array(await r.arrayBuffer());
    if(buf[0]===0x1f&&buf[1]===0x8b){buf=new Uint8Array(await new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer());}
    if(t.state!==1){return;}
    const ab=buf.buffer;let off=0;
    while(off<buf.byteLength){
      const h=new DataView(ab,off,36);const mi=h.getUint32(0,true),nv=h.getUint32(4,true),ni=h.getUint32(8,true);
      const o=[h.getFloat32(12,true),h.getFloat32(16,true),h.getFloat32(20,true)],s=[h.getFloat32(24,true),h.getFloat32(28,true),h.getFloat32(32,true)];
      off+=36;const md=man.materials[mi];
      const q=new Uint16Array(ab.slice(off,off+nv*6));off+=nv*6;
      const uv=new Float32Array(ab.slice(off,off+nv*8));off+=nv*8;
      let uv2=null;if(md.ground){uv2=new Float32Array(ab.slice(off,off+nv*8));off+=nv*8;}
      const col=new Uint8Array(ab.slice(off,off+nv*4));off+=nv*4;
      const idx=new Uint32Array(ab.slice(off,off+ni*4));off+=ni*4;
      const pos=new Float32Array(nv*3);const k=1/65535;
      for(let i=0;i<nv;i++){const x=o[0]+q[i*3]*k*s[0],y=o[1]+q[i*3+1]*k*s[1],z=o[2]+q[i*3+2]*k*s[2];
        pos[i*3]=x-O[0];pos[i*3+1]=z-O[2];pos[i*3+2]=y-O[1];}
      const m=new BABYLON.Mesh(t.id+'_'+mi,scene);
      m.setVerticesData('position',pos,false);m.setVerticesData('uv',uv,false);if(uv2)m.setVerticesData('uv2',uv2,false);
      m.setVerticesBuffer(new BABYLON.VertexBuffer(engine,col,'color',false,false,4,false,0,4,BABYLON.VertexBuffer.UNSIGNED_BYTE,true));
      m.setIndices(idx);m.material=mat(mi);m.isPickable=!!md.ground;m.freezeWorldMatrix();m.doNotSyncBoundingInfo=true;
      t.meshes.push(m);
    }
    t.state=2;
  }catch(e){console.warn('tile',t.id,e);t.state=0;}
  finally{inflight--;}
}
function unloadTile(t){t.meshes.forEach(m=>m.dispose(false,false));t.meshes=[];t.state=0;}
function stream(){
  const p=cam().position;
  const want=tiles.map(t=>({t,d:Math.hypot(t.cx-p.x,t.cz-p.z)})).sort((a,b)=>a.d-b.d);
  for(const {t,d} of want){
    if(d<fog[1]+man.cell*0.8){ if(t.state===0&&inflight<4)loadTile(t); }
    else if(d>fog[1]+man.cell*1.6&&t.state>0){ if(t.state===1)t.state=0; else unloadTile(t); }
  }
}

// ---- road line helpers
function atDist(d){d=Math.max(0,Math.min(LEN,d));let lo=0,hi=L.length-1;
  while(hi-lo>1){const mid=(lo+hi)>>1;if(L[mid][3]<=d)lo=mid;else hi=mid;}
  const a=L[lo],b=L[hi],f=(b[3]-a[3])>0?(d-a[3])/(b[3]-a[3]):0;
  return [a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f,a[2]+(b[2]-a[2])*f];}
function nearest(x,y){let best=1e18,bi=0;for(let i=0;i<L.length;i++){const dx=L[i][0]-x,dy=L[i][1]-y,q=dx*dx+dy*dy;if(q<best){best=q;bi=i;}}return {d:L[bi][3],off:Math.sqrt(best),z:L[bi][2]};}

// ---- cameras
const ride=new BABYLON.FreeCamera('ride',BABYLON.Vector3.Zero(),scene);
ride.minZ=0.2;ride.fov=1.05;
const fly=new BABYLON.UniversalCamera('fly',new BABYLON.Vector3(0,30,0),scene);
fly.inputs.removeByType('FreeCameraGamepadInput');
const isTouch=matchMedia('(pointer:coarse)').matches;
if(isTouch){fly.inputs.removeByType('FreeCameraTouchInput');fly.inputs.removeByType('FreeCameraMouseInput');}
let tmove={f:0,s:0,u:0};
let gY=null,gAcc=1;const DOWN=new BABYLON.Vector3(0,-1,0);
function probeGround(p){const h=scene.pickWithRay(new BABYLON.Ray(new BABYLON.Vector3(p.x,p.y+400,p.z),DOWN,1500),m=>m.isPickable);gY=h&&h.hit?h.pickedPoint.y:null;}
let fpv=false,fpvT0=0,bank=0,vs=0,vh=0,vz=0,lastP=null;
function setFPV(on){fpv=on;$('fpv').setAttribute('aria-pressed',on);$('osd').hidden=!on;
  document.body.classList.toggle('fpv',on);document.body.classList.toggle('compact',on&&(isTouch||innerWidth<900));
  fly.fov=on?1.6:1.0;if(!on){fly.rotation.z=0;bank=0;}fpvT0=performance.now();lastP=null;}fly.minZ=0.3;fly.fov=1.0;fly.speed=1.2;fly.angularSensibility=1600;fly.inertia=0.8;
fly.keysUp=[87,38];fly.keysDown=[83,40];fly.keysLeft=[65,37];fly.keysRight=[68,39];fly.keysUpward=[69];fly.keysDownward=[81];
let mode='ride', dist=0, playing=false, yaw=0, pitch=-0.05, kmh=90;
const cam=()=>mode==='ride'?ride:fly;
function placeRide(){
  const p=atDist(dist),a=atDist(dist+18);
  ride.position=toB(p[0],p[1],p[2]+1.25);
  const dir=toB(a[0],a[1],a[2]+1.0).subtract(ride.position);
  const base=Math.atan2(dir.x,dir.z), bp=Math.atan2(dir.y,Math.hypot(dir.x,dir.z));
  ride.rotation=new BABYLON.Vector3(-(bp+pitch),base+yaw,0);
}
// drag-to-look in ride mode
let drag=null;
canvas.addEventListener('pointerdown',e=>{if(mode==='ride'){drag={x:e.clientX,y:e.clientY,yaw,pitch};canvas.setPointerCapture(e.pointerId);}
  else if(isTouch){drag={x:e.clientX,y:e.clientY,ry:fly.rotation.y,rx:fly.rotation.x,fly:1};canvas.setPointerCapture(e.pointerId);}});
canvas.addEventListener('pointermove',e=>{if(!drag)return;
  if(drag.fly){fly.rotation.y=drag.ry+(e.clientX-drag.x)*0.005;fly.rotation.x=Math.max(-1.5,Math.min(1.5,drag.rx+(e.clientY-drag.y)*0.005));return;}
  yaw=drag.yaw+(e.clientX-drag.x)*0.005;pitch=Math.max(-1.2,Math.min(1.2,drag.pitch-(e.clientY-drag.y)*0.005));});
canvas.addEventListener('pointerup',()=>{drag=null;});
canvas.addEventListener('dblclick',()=>{yaw=0;pitch=-0.05;});
let shift=false;window.addEventListener('keydown',e=>{if(e.key==='Shift')shift=true;if(e.key===' '&&mode==='ride'){e.preventDefault();setPlay(!playing);}if((e.key==='g'||e.key==='G')&&mode==='fly'&&e.target.tagName!=='INPUT')setFPV(!fpv);});
window.addEventListener('keyup',e=>{if(e.key==='Shift')shift=false;});

function setMode(m){
  if(m===mode)return;
  if(m==='fly'){fly.position=ride.position.add(new BABYLON.Vector3(0,6,0));fly.rotation=ride.rotation.clone();ride.detachControl();scene.activeCamera=fly;fly.attachControl(canvas,true);setPlay(false);}
  else{fly.detachControl();const p=fly.position;dist=nearest(p.x+O[0],p.z+O[1]).d;yaw=0;pitch=-0.05;scene.activeCamera=ride;}
  mode=m;setHelp();$('fpv').hidden=m!=='fly';if(m!=='fly')setFPV(false);$('joy').hidden=$('rise').hidden=!(isTouch&&m==='fly');$('spd').closest('label').hidden=m==='fly';placePad();tmove={f:0,s:0,u:0};$('mRide').setAttribute('aria-pressed',m==='ride');$('mFly').setAttribute('aria-pressed',m==='fly');$('play').disabled=m!=='ride';
  canvas.focus();
}
const touch=matchMedia('(pointer:coarse)').matches;
function setHelp(){
  $('help').innerHTML=mode==='ride'
    ?(touch?'<b>Ride</b> follows the road at driver eye height. Tap Play to drive, drag to look around, slide Road or tap the map to jump.'
           :'<b>Ride</b> follows the road at driver eye height. Space or Play to drive, drag to look around, double-click to look ahead again. Slide Road, use the buttons or click the map to jump.')
    :(touch?'<b>Fly</b> moves freely. Left stick to fly forward, back and sideways; &#9650; &#9660; to climb and drop; drag anywhere else to look. FPV turns on the drone view. Tap Ride to drop back onto the road.'
           :'<b>Fly</b> moves freely. W A S D or arrows to move, E up, Q down, hold Shift to go fast, drag to look. Gamepad: left stick move, right stick look, triggers down/up, RB fast. FPV or G for the drone view. Ride drops you back onto the road.');
}
function setPlay(v){playing=v&&mode==='ride';$('play').setAttribute('aria-pressed',playing);$('play').textContent=playing?'Pause':'Play';}
$('fpv').onclick=()=>setFPV(!fpv);
$('mRide').onclick=()=>setMode('ride');$('mFly').onclick=()=>setMode('fly');$('play').onclick=()=>setPlay(!playing);
$('d').oninput=e=>{dist=+e.target.value;if(mode!=='ride')setMode('ride');};
$('spd').oninput=e=>{kmh=+e.target.value;$('spk').textContent=fmtSpd(kmh);};
function setUnits(){$('units').textContent=imp?'mi':'km';$('spk').textContent=fmtSpd(kmh);$('vdk').textContent=fmtLen(fog[1]);try{localStorage.setItem('alsUnits',imp?'mi':'km');}catch(e){}}
$('units').onclick=()=>{imp=!imp;setUnits();};
const SHARE_BASE=/claude|usercontent|anthropic/.test(location.hostname)?'https://claude.ai/artifact/5NJ2ZXTW9aC8D3oGnMtSW3':location.origin+location.pathname;
let toastT=0;function toast(html){const t=$('toast');t.innerHTML=html;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{t.hidden=true;},6000);}
$('share').onclick=()=>{
  const p=cam().position,d=Math.round(mode==='ride'?dist:nearest(p.x+O[0],p.z+O[1]).d);
  const url=SHARE_BASE+'#d'+d;
  const show=ok=>toast((ok?'Link copied for ':'Copy this link for ')+fmtDist(d)+':<br>'+url);
  try{navigator.clipboard.writeText(url).then(()=>show(true),()=>show(false));}catch(e){show(false);}
};
if(!document.fullscreenEnabled){$('fs').hidden=true;}
$('fs').onclick=()=>{(document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()).catch(()=>{$('fs').hidden=true;});};
document.addEventListener('fullscreenchange',()=>{$('fs').textContent=document.fullscreenElement?'Exit full screen':'Full screen';setTimeout(()=>engine.resize(),50);});
// gamepad for Fly: standard-mapped controllers only (Xbox / PlayStation); wheels and pedals are ignored
const DZ=0.18,dz=v=>Math.abs(v)<DZ?0:(v-Math.sign(v)*DZ)/(1-DZ);
function padFly(dt){
  const pads=navigator.getGamepads?navigator.getGamepads():[];
  for(const g of pads){
    if(!g||g.mapping!=='standard')continue;
    const lx=dz(g.axes[0]),ly=dz(g.axes[1]),rx=dz(g.axes[2]),ry=dz(g.axes[3]);
    const lt=g.buttons[6]?g.buttons[6].value:0,rt=g.buttons[7]?g.buttons[7].value:0,fast=g.buttons[5]&&g.buttons[5].pressed;
    if(!(lx||ly||rx||ry||lt>0.05||rt>0.05))continue;
    const v=(fast?70:18)*Math.max(0.6,fog[1]/700)*dt;
    const f=fly.getDirection(BABYLON.Axis.Z),r=fly.getDirection(BABYLON.Axis.X);
    fly.position.addInPlace(f.scale(-ly*v)).addInPlace(r.scale(lx*v));
    fly.position.y+=(rt-lt)*v;
    fly.rotation.y+=rx*2.2*dt;fly.rotation.x=Math.max(-1.5,Math.min(1.5,fly.rotation.x+ry*1.8*dt));
    break;
  }
}
function setView(v){fog=[Math.max(60,v*0.35),v];ride.maxZ=fly.maxZ=v+60;$('vdk').textContent=fmtLen(v);}
$('vd').oninput=e=>setView(+e.target.value);setView(700);setUnits();
const labels={'START':'Start','SPLIT 1':'Split 1','SPLIT 2':'Split 2','FINISH':'Finish'};
man.markers.filter(m=>labels[m.name]).sort((a,b)=>a.dist-b.dist).forEach(m=>{
  const b=document.createElement('button');b.textContent=labels[m.name];b.title=fmtDist(m.dist);
  b.onclick=()=>{setMode('ride');dist=Math.max(0,m.dist-(m.name==='START'?0:40));yaw=0;pitch=-0.05;};$('jumps').appendChild(b);});

// ---- minimap
const mc=$('map'),mx=mc.getContext('2d');
let bx0=1e9,bx1=-1e9,by0=1e9,by1=-1e9;L.forEach(p=>{bx0=Math.min(bx0,p[0]);bx1=Math.max(bx1,p[0]);by0=Math.min(by0,p[1]);by1=Math.max(by1,p[1]);});
const pad=24,sc=Math.min((mc.width-2*pad)/(bx1-bx0),(mc.height-2*pad)/(by1-by0));
const ox=(mc.width-(bx1-bx0)*sc)/2,oy=(mc.height-(by1-by0)*sc)/2;
const mp=(x,y)=>[ox+(x-bx0)*sc,mc.height-(oy+(y-by0)*sc)];
function drawMap(px,py){
  mx.clearRect(0,0,mc.width,mc.height);mx.lineWidth=4;mx.lineJoin='round';
  const seg=(a,b,c)=>{mx.strokeStyle=c;mx.beginPath();L.forEach((p,i)=>{if(p[3]<a||p[3]>b)return;const q=mp(p[0],p[1]);mx.lineTo(q[0],q[1]);});mx.stroke();};
  const ds=man.markers.find(m=>m.name==='DEMO start'),de=man.markers.find(m=>m.name==='DEMO end');
  seg(0,LEN,'#9fb7a3');
  man.markers.forEach(m=>{if(!labels[m.name]||m.name.startsWith('DEMO'))return;const q=mp(m.pos[0],m.pos[1]);mx.fillStyle='#16271f';mx.strokeStyle='#eee9df';mx.lineWidth=2;mx.beginPath();mx.arc(q[0],q[1],6,0,7);mx.fill();mx.stroke();});
  const q=mp(px,py);mx.fillStyle='#d9622b';mx.beginPath();mx.arc(q[0],q[1],9,0,7);mx.fill();
  const c=cam(),f=c.getDirection(BABYLON.Axis.Z);mx.strokeStyle='#d9622b';mx.lineWidth=3;mx.beginPath();mx.moveTo(q[0],q[1]);mx.lineTo(q[0]+f.x*26,q[1]-f.z*26);mx.stroke();
}
mc.addEventListener('click',e=>{const r=mc.getBoundingClientRect();const X=(e.clientX-r.left)*mc.width/r.width,Y=(e.clientY-r.top)*mc.height/r.height;
  const x=bx0+(X-ox)/sc,y=by0+(mc.height-Y-oy)/sc;setMode('ride');dist=nearest(x,y).d;});

// ---- deep link #d1234 = metres
const hm=/^d(\d+)$/.exec(location.hash.slice(1)||'');if(hm)dist=+hm[1];
placeRide();scene.activeCamera=ride;setHelp();

// ---- loop
let last=performance.now(),acc=0,uiAcc=0;
scene.onBeforeRenderObservable.add(()=>{
  const now=performance.now(),dt=Math.min(0.1,(now-last)/1000);last=now;
  if(mode==='ride'){if(playing){dist+=kmh/3.6*dt;if(dist>=LEN){dist=LEN;setPlay(false);}}placeRide();}
  else{fly.speed=(shift?4.5:1.2)*Math.max(0.6,fog[1]/700);padFly(dt);if(tmove.f||tmove.s||tmove.u){const v=22*Math.max(0.6,fog[1]/700)*dt;fly.position.addInPlace(fly.getDirection(BABYLON.Axis.Z).scale(tmove.f*v)).addInPlace(fly.getDirection(BABYLON.Axis.X).scale(tmove.s*v));fly.position.y+=tmove.u*v;}
    gAcc+=dt;if(gAcc>0.1){gAcc=0;probeGround(fly.position);}
    if(fpv&&gY!==null&&fly.position.y<gY+0.5)fly.position.y=gY+0.5;
    if(fpv&&dt>0){const P=fly.position.clone();
      if(lastP){const d=P.subtract(lastP).scale(1/dt),r=fly.getDirection(BABYLON.Axis.X);
        const k=Math.min(1,dt*6);vh+=(Math.hypot(d.x,d.y,d.z)-vh)*k;vs+=(BABYLON.Vector3.Dot(d,r)-vs)*k;}
      lastP=P;const target=Math.max(-0.4,Math.min(0.4,-vs/30));bank+=(target-bank)*Math.min(1,dt*4);fly.rotation.z=bank;}}
  acc+=dt;if(acc>0.25){acc=0;stream();}
  uiAcc+=dt;if(uiAcc>0.15){uiAcc=0;
    const p=cam().position,x=p.x+O[0],y=p.z+O[1];const n=mode==='ride'?{d:dist,off:0}:nearest(x,y);
    $('rkm').textContent=fmtDist(n.d);
    $('rinfo').textContent=mode==='ride'?(playing?fmtSpd(kmh):'paused'):`${fmtLen(n.off)} from road · ${fmtLen(p.y+O[2])} elev`;
    if(document.activeElement!==$('d')){$('d').value=Math.round(n.d);}$('dk').textContent=fmtDist(n.d);
    if(fpv){const nn=mode==='fly'?n:nearest(x,y);
      $('oAlt').textContent=fmtLen(Math.max(0,gY!==null?p.y-gY:p.y+O[2]-nn.z));$('oSpd').textContent=fmtSpd(Math.round(vh*3.6));
      const t=Math.floor((performance.now()-fpvT0)/1000);$('oTim').textContent=String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');
      let h=Math.round(((fly.rotation.y*180/Math.PI)%360+360)%360);$('oHdg').textContent=String(h).padStart(3,'0');
      $('oDst').textContent=fmtDist(nn.d);$('oOff').textContent=fmtLen(nn.off);}
    drawMap(x,y);}
});
// first view: wait until nearby tiles are in before revealing
stream();
const t0=performance.now();
await new Promise(res=>{const iv=setInterval(()=>{stream();const near=tiles.filter(t=>Math.hypot(t.cx-ride.position.x,t.cz-ride.position.z)<450);
  const done=near.filter(t=>t.state===2).length;$('lmsg').textContent=`Loading stage… ${done}/${near.length} nearby sections`;
  if(done===near.length||performance.now()-t0>25000){clearInterval(iv);res();}},200);});
engine.runRenderLoop(()=>scene.render());
scene.executeWhenReady(()=>{$('load').hidden=true;canvas.focus();});
window.addEventListener('resize',()=>engine.resize());
function placePad(){const b=(document.querySelector('.bar').offsetHeight+14)+'px';$('joy').style.bottom=b;$('rise').style.bottom=b;}
window.addEventListener('resize',placePad);
document.querySelectorAll('#rise button').forEach(b=>{const v=+b.dataset.u;
  const on=e=>{e.preventDefault();tmove.u=v;b.classList.add('on');},off=()=>{if(tmove.u===v)tmove.u=0;b.classList.remove('on');};
  b.addEventListener('pointerdown',on);['pointerup','pointercancel','pointerleave'].forEach(t=>b.addEventListener(t,off));b.addEventListener('contextmenu',e=>e.preventDefault());});
{const J=$('joy'),K=$('knob'),RAD=46;let jid=null;
 const upd=e=>{const r=J.getBoundingClientRect();let dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);
   const l=Math.hypot(dx,dy);if(l>RAD){dx*=RAD/l;dy*=RAD/l;}K.style.transform=`translate(${dx}px,${dy}px)`;
   const dz=v=>Math.abs(v)<0.15?0:v;tmove.f=dz(-dy/RAD);tmove.s=dz(dx/RAD);};
 J.addEventListener('pointerdown',e=>{e.preventDefault();jid=e.pointerId;J.setPointerCapture(jid);upd(e);});
 J.addEventListener('pointermove',e=>{if(e.pointerId===jid)upd(e);});
 const end=e=>{if(e.pointerId!==jid)return;jid=null;K.style.transform='';tmove.f=tmove.s=0;};
 J.addEventListener('pointerup',end);J.addEventListener('pointercancel',end);}
window.__als={scene,engine,tiles,setMode,go:d=>{dist=d;},setView};
})().catch(e=>{document.getElementById('lmsg').textContent='The stage could not load: '+e.message;console.error(e);});
</script>
